[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aprilaire-homekit"
version = "0.1.0"
description = "Local desktop bridge from an AprilAire thermostat to Apple Home"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Anthony DiTano" }]
dependencies = [
  "HAP-python>=4.9,<6",
  "PyYAML>=6",
  "base36>=0.1.1",
  "psutil>=5.9",
  "pyaprilaire==0.8.1",
  "pyqrcode>=1.2.1",
  "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[project.scripts]
aprilaire-homekit = "aprilaire_homekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aprilaire_homekit = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# These hits are existing style, not defects. Broad handlers stay in place
# so a desktop process and the test peer keep their current error paths.
ignore = ["BLE001", "I001", "RUF100", "S110", "SIM103"]
